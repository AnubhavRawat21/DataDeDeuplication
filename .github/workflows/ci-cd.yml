name: CloudSieve Pro CI/CD

# ─────────────────────────────────────────────────────────────────────────────
# Full AWS DevSecOps Pipeline
#  Stage 1  — Code Lint (flake8 + React build)
#  Stage 2  — Automated Pytest suite + XML report
#  Stage 3  — Checkov IaC security scan (Terraform)
#  Stage 4  — AWS OIDC login → ECR build & push (backend + frontend)
#  Stage 5  — EKS rolling deploy + S3 archival of test/scan reports
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # OIDC token for AWS authentication (no stored secrets)
  contents: read

env:
  AWS_REGION:          ap-southeast-2
  EKS_CLUSTER_NAME:    cloudsieve-eks
  ECR_BACKEND_REPO:    cloudsieve-backend
  ECR_FRONTEND_REPO:   cloudsieve-frontend
  S3_BUCKET:           cloudsieve-pro-results-345794120758
  ROLE_ARN:            arn:aws:iam::345794120758:role/cloudsieve-pro-github-actions-role
  AWS_ACCOUNT_ID:      345794120758

# ══════════════════════════════════════════════════════════════════════════════
# Stage 1 — Code Quality & Lint
# ══════════════════════════════════════════════════════════════════════════════
jobs:
  lint:
    name: "🔍 Code Lint & Frontend Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Python backend
        run: |
          pip install flake8
          cd backend
          flake8 main.py engine.py \
            --max-line-length=120 \
            --ignore=E501,W503,E302,E303,E241,E221,W292,F401,W293,E305,W291,W605,E265,E266

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend (lint check)
        run: |
          cd frontend
          npm ci --silent
          CI=false npm run build

# ══════════════════════════════════════════════════════════════════════════════
# Stage 2 — Automated Test Suite
# ══════════════════════════════════════════════════════════════════════════════
  test:
    name: "🧪 Pytest Backend Suite"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --quiet -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Pytest suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short \
            --junitxml=pytest-report.xml \
            -p no:warnings

      - name: Upload pytest XML report
        uses: actions/upload-artifact@v4
        if: always()   # upload even on failure for debugging
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          retention-days: 30

# ══════════════════════════════════════════════════════════════════════════════
# Stage 3 — DevSecOps: Checkov IaC Scan
# ══════════════════════════════════════════════════════════════════════════════
  security-scan:
    name: "🛡️ Checkov IaC Security Scan"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli
          download_external_modules: false

# ══════════════════════════════════════════════════════════════════════════════
# Stage 4 — AWS OIDC → ECR Docker Build & Push
# (only on push to main, not on PRs)
# ══════════════════════════════════════════════════════════════════════════════
  build-and-push:
    name: "🐳 Build & Push to Amazon ECR"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to AWS (OIDC with diagnostic fallback)
        id: aws-auth
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "### AWS Authentication Diagnostics" >> $GITHUB_STEP_SUMMARY

          # Check if secret keys are available
          if [ -n "$AWS_KEY" ] && [ -n "$AWS_SEC" ]; then
            echo "Using repository secrets (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)" >> $GITHUB_STEP_SUMMARY
            echo "AWS_ACCESS_KEY_ID=$AWS_KEY" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SEC" >> $GITHUB_ENV
            echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV
            exit 0
          fi

          echo "Requesting OIDC token from GitHub Actions token service..."
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "❌ ACTIONS_ID_TOKEN_REQUEST_URL is NOT set! OIDC permission denied by GitHub." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          TOKEN_RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(echo "$TOKEN_RESP" | jq -r .value // empty)

          if [ -z "$OIDC_TOKEN" ]; then
            echo "❌ Failed to retrieve OIDC token. Response: $TOKEN_RESP" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Inspect claims without signature verification
          python3 -c "
import json, base64, os
token = os.environ.get('OIDC_TOKEN', '')
parts = token.split('.')
if len(parts) == 3:
    payload = json.loads(base64.urlsafe_b64decode(parts[1] + '=='))
    sub = payload.get('sub')
    aud = payload.get('aud')
    iss = payload.get('iss')
    repo = payload.get('repository')
    print(f'OIDC Claims: sub={sub}, aud={aud}, iss={iss}, repo={repo}')
    with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
        f.write(f'- **OIDC sub**: \`{sub}\`\n')
        f.write(f'- **OIDC aud**: \`{aud}\`\n')
        f.write(f'- **OIDC iss**: \`{iss}\`\n')
        f.write(f'- **OIDC repo**: \`{repo}\`\n')
"

          echo "Attempting sts:AssumeRoleWithWebIdentity..."
          ASSUME_OUT=$(aws sts assume-role-with-web-identity \
            --role-arn "${{ env.ROLE_ARN }}" \
            --role-session-name "GitHubActions-${{ github.run_id }}" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 3600 \
            --region "${{ env.AWS_REGION }}" 2>&1) || {
              echo "❌ AssumeRoleWithWebIdentity failed:" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "$ASSUME_OUT" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "$ASSUME_OUT"
              exit 1
            }

          echo "✅ OIDC AssumeRole succeeded!" >> $GITHUB_STEP_SUMMARY
          export AWS_ACCESS_KEY_ID=$(echo "$ASSUME_OUT" | jq -r .Credentials.AccessKeyId)
          export AWS_SECRET_ACCESS_KEY=$(echo "$ASSUME_OUT" | jq -r .Credentials.SecretAccessKey)
          export AWS_SESSION_TOKEN=$(echo "$ASSUME_OUT" | jq -r .Credentials.SessionToken)
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"

          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building backend image..."
          docker build \
            -f docker/Dockerfile.backend \
            -t $REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG \
            -t $REGISTRY/$ECR_BACKEND_REPO:latest \
            ./backend
          echo "Pushing backend image..."
          docker push $REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest
          echo "✅ Backend image pushed: $REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG"

      - name: Build & push frontend image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building frontend image..."
          docker build \
            -f docker/Dockerfile.frontend \
            -t $REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG \
            -t $REGISTRY/$ECR_FRONTEND_REPO:latest \
            ./frontend
          echo "Pushing frontend image..."
          docker push $REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest
          echo "✅ Frontend image pushed: $REGISTRY/$ECR_FRONTEND_REPO:$IMAGE_TAG"

# ══════════════════════════════════════════════════════════════════════════════
# Stage 5 — Deploy to Amazon EKS + Archive Artifacts to S3
# ══════════════════════════════════════════════════════════════════════════════
  deploy-and-archive:
    name: "🚀 Deploy EKS + Archive to S3"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to AWS (OIDC with diagnostic fallback)
        env:
          AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SEC: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$AWS_KEY" ] && [ -n "$AWS_SEC" ]; then
            echo "AWS_ACCESS_KEY_ID=$AWS_KEY" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SEC" >> $GITHUB_ENV
            echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV
            exit 0
          fi

          TOKEN_RESP=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")
          OIDC_TOKEN=$(echo "$TOKEN_RESP" | jq -r .value // empty)

          ASSUME_OUT=$(aws sts assume-role-with-web-identity \
            --role-arn "${{ env.ROLE_ARN }}" \
            --role-session-name "GitHubActions-deploy-${{ github.run_id }}" \
            --web-identity-token "$OIDC_TOKEN" \
            --duration-seconds 3600 \
            --region "${{ env.AWS_REGION }}")

          export AWS_ACCESS_KEY_ID=$(echo "$ASSUME_OUT" | jq -r .Credentials.AccessKeyId)
          export AWS_SECRET_ACCESS_KEY=$(echo "$ASSUME_OUT" | jq -r .Credentials.SecretAccessKey)
          export AWS_SESSION_TOKEN=$(echo "$ASSUME_OUT" | jq -r .Credentials.SessionToken)
          export AWS_DEFAULT_REGION="${{ env.AWS_REGION }}"

          echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY" >> $GITHUB_ENV
          echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV
          echo "::add-mask::$AWS_ACCESS_KEY_ID"
          echo "::add-mask::$AWS_SECRET_ACCESS_KEY"
          echo "::add-mask::$AWS_SESSION_TOKEN"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $EKS_CLUSTER_NAME
          kubectl cluster-info
          kubectl get nodes

      - name: Set image tags in manifests
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Substitute :latest with the precise commit SHA for this deploy
          BACKEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPO}:${IMAGE_TAG}"
          FRONTEND_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND_REPO}:${IMAGE_TAG}"
          sed -i "s|.*cloudsieve-backend:.*|          image: ${BACKEND_IMAGE}|" k8s/backend-deployment.yaml
          sed -i "s|.*cloudsieve-frontend:.*|          image: ${FRONTEND_IMAGE}|" k8s/frontend-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml

      - name: Wait for rollout to complete
        run: |
          kubectl rollout restart deployment/cloudsieve-backend  -n cloudsieve
          kubectl rollout restart deployment/cloudsieve-frontend -n cloudsieve
          kubectl rollout status  deployment/cloudsieve-backend  -n cloudsieve --timeout=300s
          kubectl rollout status  deployment/cloudsieve-frontend -n cloudsieve --timeout=300s

      - name: Verify live deployment
        run: |
          echo "=== Pods ==="
          kubectl get pods -n cloudsieve -o wide
          echo "=== Services ==="
          kubectl get svc  -n cloudsieve

      - name: Download pytest report artifact
        uses: actions/download-artifact@v4
        with:
          name: pytest-report
          path: artifacts/

      - name: Archive CI/CD run artifacts to S3
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d_%H%M%S)
          RUN_PREFIX="ci-cd-runs/${TIMESTAMP}_run${{ github.run_number }}_${IMAGE_TAG}"

          # Upload pytest report
          aws s3 cp artifacts/pytest-report.xml \
            "s3://${S3_BUCKET}/${RUN_PREFIX}/pytest-report.xml"

          # Create a deploy summary JSON
          cat > deploy-summary.json << EOF
          {
            "run_number":   ${{ github.run_number }},
            "run_id":       "${{ github.run_id }}",
            "commit_sha":   "${IMAGE_TAG}",
            "commit_msg":   "${{ github.event.head_commit.message }}",
            "triggered_by": "${{ github.actor }}",
            "timestamp":    "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "eks_cluster":  "${EKS_CLUSTER_NAME}",
            "region":       "${AWS_REGION}",
            "backend_image": "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_BACKEND_REPO}:${IMAGE_TAG}",
            "frontend_image": "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_FRONTEND_REPO}:${IMAGE_TAG}",
            "status":       "deployed"
          }
          EOF

          aws s3 cp deploy-summary.json \
            "s3://${S3_BUCKET}/${RUN_PREFIX}/deploy-summary.json"

          echo "✅ Artifacts archived to: s3://${S3_BUCKET}/${RUN_PREFIX}/"
          echo "📦 S3 CI/CD run history:"
          aws s3 ls "s3://${S3_BUCKET}/ci-cd-runs/" | tail -5
