name: CloudSieve Pro CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  EC2_HOST_DEFAULT: "13.201.99.77"
  EC2_USER_DEFAULT: "ubuntu"

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # Stage 1 — Code Quality & Lint
  # ══════════════════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 Code Lint & React Build"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Python backend
        run: |
          pip install flake8
          cd backend
          flake8 main.py engine.py \
            --max-line-length=120 \
            --ignore=E501,W503,E302,E303,E241,E221,W292,F401,W293,E305,W291,W605,E265,E266

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build React frontend
        run: |
          cd frontend
          npm ci --silent
          CI=false npm run build

  # ══════════════════════════════════════════════════════════════════════════════
  # Stage 2 — Automated Backend Pytest Suite
  # ══════════════════════════════════════════════════════════════════════════════
  test:
    name: "🧪 Pytest Backend Suite"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --quiet -r requirements.txt pytest pytest-asyncio httpx

      - name: Run Pytest suite
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short \
            --junitxml=pytest-report.xml \
            -p no:warnings

      - name: Upload Pytest XML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-report
          path: backend/pytest-report.xml
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════════
  # Stage 3 — Docker Images Build Verification
  # ══════════════════════════════════════════════════════════════════════════════
  docker-build:
    name: "🐳 Docker Build Verification"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        run: |
          docker build \
            -f docker/Dockerfile.backend \
            -t cloudsieve-backend:test \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            -f docker/Dockerfile.frontend \
            -t cloudsieve-frontend:test \
            ./frontend

  # ══════════════════════════════════════════════════════════════════════════════
  # Stage 4 — Automated Deployment to EC2 Instance
  # ══════════════════════════════════════════════════════════════════════════════
  deploy:
    name: "🚀 Deploy to EC2 Production"
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST || env.EC2_HOST_DEFAULT }}
          EC2_USER: ${{ secrets.EC2_USER || env.EC2_USER_DEFAULT }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "⚠️ Secret EC2_SSH_KEY is not defined in GitHub repository secrets."
            echo "Please add EC2_SSH_KEY (contents of DataDeDuplication.pem) in GitHub Settings -> Secrets -> Actions."
            echo "Skipping direct SSH deployment step for this run."
            exit 0
          fi

          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          echo "Connecting to $EC2_USER@$EC2_HOST..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'EOF'
            set -e
            APP_DIR="/home/ubuntu/DataDeDuplication"
            REPO_URL="https://github.com/AnubhavRawat21/DataDeDeuplication.git"

            if [ ! -d "$APP_DIR" ]; then
              echo "Cloning repository..."
              git clone "$REPO_URL" "$APP_DIR"
            else
              echo "Pulling latest changes..."
              cd "$APP_DIR"
              git fetch origin
              git reset --hard origin/main
            fi

            cd "$APP_DIR"
            echo "Deploying CloudSieve Pro with Prometheus, Grafana & Alertmanager..."
            docker compose -f docker/docker-compose.yml down --remove-orphans || true
            docker compose -f docker/docker-compose.yml up -d --build

            echo "Awaiting services startup..."
            sleep 10

            echo "=== Service Status ==="
            docker compose -f docker/docker-compose.yml ps

            echo "=== Health Checks ==="
            curl -sf http://localhost:8000/health || echo "Backend starting up..."
            curl -sf http://localhost:9090/-/healthy || echo "Prometheus starting up..."
            curl -sf http://localhost:9093/-/healthy || echo "Alertmanager starting up..."
            echo "Deployment completed successfully!"
          EOF
