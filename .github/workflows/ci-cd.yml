name: CloudSieve Pro — AWS DevSecOps CI/CD Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# End-to-End CI/CD Pipeline
# 1. Lint & Automated Pytest Suite
# 2. Checkov IaC & Security Scanning
# 3. AWS IAM OIDC Authentication (Zero hardcoded secrets, managed via Terraform)
# 4. Amazon ECR Multi-Arch Docker Build & Push
# 5. Amazon EKS Rolling Deployment
# 6. Test artifact & scan report archival directly into Amazon S3
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required to checkout the code

env:
  AWS_REGION: ap-southeast-2
  EKS_CLUSTER_NAME: cloudsieve-eks
  ECR_BACKEND_REPO: cloudsieve-backend
  ECR_FRONTEND_REPO: cloudsieve-frontend
  S3_BUCKET: cloudsieve-pro-results-345794120758
  ROLE_ARN: arn:aws:iam::345794120758:role/cloudsieve-pro-github-actions-role

jobs:

  # ── Stage 1: Quality & Lint ──
  lint:
    name: "🔍 Code Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Backend
        run: |
          pip install flake8
          cd backend
          flake8 main.py engine.py --max-line-length=120 --ignore=E501,W503,E302,E303,E241,E221,W292,F401,W293,E305

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci --silent
          npm run build

  # ── Stage 2: Automated Testing ──
  test:
    name: "🧪 Automated Pytest Suite"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pip install -r requirements.txt pytest httpx
          python -m pytest tests/ -v --tb=short --junitxml=pytest-report.xml

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: backend/pytest-report.xml

  # ── Stage 3: DevSecOps Security Scan ──
  security-scan:
    name: "🛡️ DevSecOps IaC Scan"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Checkov Terraform Security Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli

  # ── Stage 4: AWS OIDC Authenticated Build & Push to ECR ──
  build-and-push:
    name: "🐳 Build & Push ECR (AWS OIDC)"
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f docker/Dockerfile.backend -t $REGISTRY/$ECR_BACKEND_REPO:latest -t $REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }} ./backend
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest
          docker push $REGISTRY/$ECR_BACKEND_REPO:${{ github.sha }}

      - name: Build & Push Frontend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -f docker/Dockerfile.frontend -t $REGISTRY/$ECR_FRONTEND_REPO:latest -t $REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }} ./frontend
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest
          docker push $REGISTRY/$ECR_FRONTEND_REPO:${{ github.sha }}

  # ── Stage 5: Deploy to Amazon EKS & Archive to S3 ──
  deploy-eks:
    name: "🚀 Deploy EKS & S3 Archive"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download Pytest Artifact
        uses: actions/download-artifact@v4
        with:
          name: pytest-report
          path: artifacts/

      - name: Save Pipeline Build Artifacts to S3
        run: |
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          aws s3 cp artifacts/pytest-report.xml s3://${{ env.S3_BUCKET }}/ci-cd-runs/${TIMESTAMP}_commit_${{ github.sha }}_report.xml
          echo "Published CI/CD build run to s3://${{ env.S3_BUCKET }}/ci-cd-runs/"

      - name: Update kubeconfig for Amazon EKS
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}

      - name: Apply Kubernetes Deployments to EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/frontend-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/frontend-deployment.yaml
          kubectl rollout restart deployment/cloudsieve-backend -n cloudsieve
          kubectl rollout restart deployment/cloudsieve-frontend -n cloudsieve
          kubectl rollout status deployment/cloudsieve-backend -n cloudsieve --timeout=180s
          kubectl rollout status deployment/cloudsieve-frontend -n cloudsieve --timeout=180s

      - name: Verify Live Deployment Status
        run: |
          kubectl get pods -n cloudsieve -o wide
          kubectl get svc -n cloudsieve
