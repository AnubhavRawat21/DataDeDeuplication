name: CloudSieve Pro — AWS DevSecOps Pipeline

# ─────────────────────────────────────────────────────────────────────────────
# All heavy workloads (Docker builds, security scans, EKS deployments) run on
# AWS CodeBuild — zero local or GitHub-runner compute for the actual work.
# GitHub Actions is the lightweight orchestrator only.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:          ap-southeast-2
  EKS_CLUSTER_NAME:    cloudsieve-eks
  ECR_BACKEND_REPO:    cloudsieve-backend
  ECR_FRONTEND_REPO:   cloudsieve-frontend
  CODEBUILD_BUILD:     cloudsieve-pro-build
  CODEBUILD_DEPLOY:    cloudsieve-pro-deploy

jobs:

  # ── Stage 1: Lint (lightweight, runs on GitHub) ──────────────────────────
  lint:
    name: "🔍 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint backend
        run: |
          pip install flake8
          cd backend
          flake8 main.py engine.py \
            --max-line-length=120 \
            --ignore=E501,W503,E302,E303,E241,E221,W292,F401,W293,E305

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend (lint check)
        run: |
          cd frontend
          npm ci --silent
          npm run build

  # ── Stage 2: Tests (lightweight, runs on GitHub) ──────────────────────────
  test:
    name: "🧪 Test"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run pytest suite
        run: |
          cd backend
          pip install -r requirements.txt pytest httpx
          python -m pytest tests/ -v --tb=short

  # ── Stage 3: IaC Security Scan (runs on GitHub — no AWS access needed) ───
  iac-scan:
    name: "🛡️ IaC Security Scan"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Checkov — Terraform IaC scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          soft_fail: true
          output_format: cli

  # ── Stage 4: Build & Push on AWS CodeBuild ───────────────────────────────
  # Docker build + ECR push + Trivy image scan all run on AWS CodeBuild.
  # No Docker daemon on GitHub runners.
  build-on-aws:
    name: "🐳 Build & Push (AWS CodeBuild)"
    runs-on: ubuntu-latest
    needs: [test, iac-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Trigger AWS CodeBuild — Build & Push images
        id: codebuild-build
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name ${{ env.CODEBUILD_BUILD }} \
            --region ${{ env.AWS_REGION }} \
            --query 'build.id' \
            --output text)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Started CodeBuild: $BUILD_ID"

      - name: Wait for CodeBuild to finish
        run: |
          BUILD_ID="${{ steps.codebuild-build.outputs.build_id }}"
          echo "Waiting for build: $BUILD_ID"
          while true; do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text)
            echo "Status: $STATUS"
            case $STATUS in
              SUCCEEDED)
                echo "✅ CodeBuild succeeded"
                exit 0 ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                echo "❌ CodeBuild failed with status: $STATUS"
                exit 1 ;;
              *)
                sleep 20 ;;
            esac
          done

  # ── Stage 5: Deploy to EKS on AWS CodeBuild ──────────────────────────────
  # kubectl + k8s manifest apply runs on AWS CodeBuild — no local kubectl.
  deploy-on-aws:
    name: "🚀 Deploy to EKS (AWS CodeBuild)"
    runs-on: ubuntu-latest
    needs: build-on-aws
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Trigger AWS CodeBuild — Deploy to EKS
        id: codebuild-deploy
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name ${{ env.CODEBUILD_DEPLOY }} \
            --region ${{ env.AWS_REGION }} \
            --query 'build.id' \
            --output text)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Started CodeBuild deploy: $BUILD_ID"

      - name: Wait for Deploy CodeBuild to finish
        run: |
          BUILD_ID="${{ steps.codebuild-deploy.outputs.build_id }}"
          echo "Waiting for deploy: $BUILD_ID"
          while true; do
            STATUS=$(aws codebuild batch-get-builds \
              --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' \
              --output text)
            echo "Status: $STATUS"
            case $STATUS in
              SUCCEEDED)
                echo "✅ Deployment succeeded"
                exit 0 ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                echo "❌ Deployment failed with status: $STATUS"
                exit 1 ;;
              *)
                sleep 20 ;;
            esac
          done

      - name: Get ALB endpoint
        run: |
          aws codebuild batch-get-builds \
            --ids "${{ steps.codebuild-deploy.outputs.build_id }}" \
            --query 'builds[0].logs.{group:groupName,stream:streamName}' \
            --output table
